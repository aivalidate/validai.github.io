<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Formula GP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="오픈휠 그랑프리 레이싱 — 예선, 20대 결승, DRS, 차고 업그레이드, 시즌 커리어까지 브라우저와 휴대폰에서 즐기는 팬메이드 레이싱 게임">
<meta name="theme-color" content="#07090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Formula GP">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Saira+Condensed:ital,wght@0,500;0,700;0,800;1,700;1,800&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #07090c;
  --panel: rgba(9, 12, 16, 0.78);
  --panel-2: rgba(22, 27, 34, 0.9);
  --line: rgba(255, 255, 255, 0.12);
  --line-soft: rgba(255, 255, 255, 0.07);
  --text: #f3f6f9;
  --muted: #95a2b1;
  --accent: #1bb4ff;
  --accent-deep: #0a7fc4;
  --accent-ink: #04121c;
  --gold: #f7c548;
  --silver: #c9d1da;
  --bronze: #d38b52;
  --purple: #b25cff;
  --green: #36d676;
  --yellow: #ffd23c;
  --red: #ff4438;
  --display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --slant: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.it { font-family: var(--display); font-style: italic; }
[hidden] { display: none !important; }

/* ================= HUD (RR3 스타일) ================= */
#hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
.hb { background: var(--panel); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
#hud-tl { position: absolute; left: calc(10px + var(--safe-l)); top: calc(10px + var(--safe-t)); display: flex; gap: 6px; align-items: stretch; }
.hbtn { pointer-events: auto; width: 46px; display: grid; place-items: center; border: 0; cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: 1px; color: var(--text); }
.hbtn:active { background: rgba(27, 180, 255, 0.45); }
.hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stat-pos { padding: 3px 14px 2px 10px; display: flex; flex-direction: column; justify-content: center; border-left: 4px solid var(--accent); }
.stat-pos small, .stat-lap small, .time-box small { font-size: 12px; letter-spacing: 2px; color: var(--muted); font-weight: 700; font-style: italic; line-height: 1; }
.stat-pos b { font-size: 46px; font-weight: 800; font-style: italic; line-height: 0.9; letter-spacing: -1px; }
.stat-pos b span { font-size: 22px; color: var(--muted); letter-spacing: 0; }
.stat-lap { padding: 5px 12px; display: flex; flex-direction: column; justify-content: center; }
.stat-lap b { font-size: 28px; font-weight: 800; font-style: italic; line-height: 1; }
#tower { position: absolute; left: calc(10px + var(--safe-l)); top: calc(78px + var(--safe-t)); width: 190px; font-size: 16px; }
#tower .row { display: grid; grid-template-columns: 22px 4px 1fr auto; align-items: center; gap: 7px; height: 25px; padding: 0 9px 0 6px; background: var(--panel); margin-bottom: 2px; }
#tower .row .p { text-align: right; font-weight: 800; font-style: italic; color: var(--muted); }
#tower .row .c { height: 15px; }
#tower .row .n { font-weight: 800; letter-spacing: 0.5px; font-style: italic; }
#tower .row .g { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
#tower .row.me { background: var(--accent); color: var(--accent-ink); }
#tower .row.me .p, #tower .row.me .g { color: var(--accent-ink); }
#tower .tnote { font-family: var(--body); font-size: 12px; color: var(--muted); padding: 6px 9px; line-height: 1.4; background: var(--panel); }
#tower .head { font-size: 12px; letter-spacing: 2px; color: var(--muted); padding: 4px 9px; font-weight: 700; font-style: italic; background: var(--panel); margin-bottom: 2px; }
#hud-tr { position: absolute; right: calc(10px + var(--safe-r)); top: calc(10px + var(--safe-t)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.time-box { padding: 5px 12px 6px; text-align: right; min-width: 176px; border-right: 4px solid var(--accent); }
.time-box .cur { font-size: 30px; font-weight: 800; font-style: italic; line-height: 1; }
.time-box .cur.invalid { color: var(--red); text-decoration: line-through; }
.time-box .row2 { display: flex; justify-content: flex-end; gap: 10px; font-size: 15px; color: var(--muted); margin-top: 2px; font-style: italic; }
.time-box .row2 b { color: var(--text); }
#split { font-size: 20px; font-weight: 800; font-style: italic; padding: 1px 10px; opacity: 0; transition: opacity 0.2s; }
#split.show { opacity: 1; }
#split.faster { background: var(--green); color: #04150b; }
#split.slower { background: var(--red); color: #fff; }
#sectors { display: flex; gap: 3px; margin-top: 5px; }
#sectors i { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.14); }
#sectors i.purple { background: var(--purple); }
#sectors i.green { background: var(--green); }
#sectors i.yellow { background: var(--yellow); }
#minimap { width: 170px; height: 130px; }
#hud-br { position: absolute; right: calc(12px + var(--safe-r)); bottom: calc(12px + var(--safe-b)); }
.speedo { position: relative; width: 190px; height: 118px; }
.speedo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.speedo .arc-bg { fill: none; stroke: rgba(0, 0, 0, 0.55); stroke-width: 12; }
.speedo .arc { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: butt; }
.speedo .arc.hot { stroke: var(--red); }
.speedo .kmh { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; }
.speedo .kmh b { font-size: 54px; font-weight: 800; font-style: italic; line-height: 0.85; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
.speedo .kmh small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: 2px; font-style: italic; }
.speedo .gear { position: absolute; right: -4px; top: 6px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 26px; font-weight: 800; font-style: italic; background: var(--panel); border: 2px solid var(--accent); border-radius: 50%; }
.leds { position: absolute; left: 22px; right: 22px; top: -14px; display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.leds i { height: 6px; background: rgba(0, 0, 0, 0.45); }
.leds i.g { background: #2ee06a; } .leds i.r { background: #ff2d2d; } .leds i.b { background: #3e8bff; }
#hud-bl { position: absolute; left: calc(12px + var(--safe-l)); bottom: calc(12px + var(--safe-b)); display: flex; gap: 8px; align-items: flex-end; }
.chip { padding: 6px 14px; font-size: 18px; font-weight: 800; font-style: italic; letter-spacing: 1px; color: var(--muted); display: flex; align-items: center; gap: 8px; clip-path: var(--slant); }
.chip.on { color: #04150b; background: var(--green); }
.chip.warn { color: #1a1300; background: var(--yellow); }
.chip small { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: 0; font-style: normal; }
#msg { position: absolute; left: 50%; top: 27%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; }
#msg .big { font-size: clamp(36px, 7vw, 70px); font-weight: 800; font-style: italic; letter-spacing: 0.5px; text-shadow: 0 3px 18px rgba(0, 0, 0, 0.65); line-height: 1; }
#msg .small { font-family: var(--body); font-size: 16px; font-weight: 700; margin-top: 8px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
#msg.show { animation: pop 0.25s ease-out; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(1.15); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
#lights { position: absolute; left: 50%; top: calc(80px + var(--safe-t)); transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 14px; background: var(--panel); }
#lights .col { display: flex; flex-direction: column; gap: 6px; background: #050608; padding: 6px; border-radius: 6px; }
#lights .col i { width: 28px; height: 28px; border-radius: 50%; background: #2a0909; }
#lights.on .col.lit i { background: #ff1f1f; box-shadow: 0 0 18px #ff1f1f; }
#tags { position: absolute; inset: 0; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); font-size: 14px; font-weight: 800; font-style: italic; padding: 1px 7px; background: rgba(6, 8, 11, 0.72); white-space: nowrap; border-left: 3px solid #fff; }
#hint { position: absolute; left: 50%; bottom: calc(12px + var(--safe-b)); transform: translateX(-50%); font-family: var(--body); font-size: 12px; color: var(--muted); padding: 6px 12px; white-space: nowrap; background: var(--panel); }
#intro { position: absolute; left: calc(18px + var(--safe-l)); bottom: calc(22% + var(--safe-b)); padding: 10px 20px 12px 16px; border-left: 5px solid var(--accent); background: var(--panel); }
#intro small { display: block; font-size: 14px; letter-spacing: 3px; color: var(--accent); font-weight: 800; font-style: italic; }
#intro b { display: block; font-size: 40px; font-style: italic; font-weight: 800; line-height: 1; }
#intro span { font-family: var(--body); font-size: 13px; color: var(--muted); }

/* 터치 조작 */
#touch { position: fixed; inset: 0; pointer-events: none; }
#touch .zone { position: absolute; pointer-events: auto; touch-action: none; }
#touch .zone.l { left: 0; top: 30%; bottom: 0; width: 50%; }
#touch .zone.r { right: 0; top: 30%; bottom: 0; width: 50%; }
#touch .zone .ghost { position: absolute; bottom: calc(26px + var(--safe-b)); font-family: var(--display); font-size: 44px; font-weight: 800; color: rgba(255, 255, 255, 0.22); }
#touch .zone.l .ghost { left: calc(34px + var(--safe-l)); }
#touch .zone.r .ghost { right: calc(230px + var(--safe-r)); }
#touch .zone.active .ghost { color: rgba(27, 180, 255, 0.7); }
#touch .pad { position: absolute; bottom: calc(12px + var(--safe-b)); pointer-events: auto; display: flex; gap: 12px; align-items: flex-end; }
#touch .pad.left { left: calc(12px + var(--safe-l)); }
#touch .pad.right { right: calc(12px + var(--safe-r)); }
#touch .pad.center { left: 50%; transform: translateX(-50%); }
#touch .tb { width: 86px; height: 86px; border-radius: 50%; background: rgba(0, 0, 0, 0.32); border: 2px solid rgba(255, 255, 255, 0.28); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-style: italic; font-size: 20px; color: rgba(255, 255, 255, 0.9); touch-action: none; }
#touch .tb.active { background: rgba(27, 180, 255, 0.45); border-color: var(--accent); }
#touch .pedal { width: 92px; height: 120px; border-radius: 14px; }
#touch .pedal.brake { background: rgba(255, 68, 56, 0.25); border-color: rgba(255, 68, 56, 0.65); }
#touch .pedal.brake.active { background: rgba(255, 68, 56, 0.6); }
#touch .pedal.gas { background: rgba(54, 214, 118, 0.2); border-color: rgba(54, 214, 118, 0.6); height: 140px; }
#touch .tb.small { width: 70px; height: 46px; border-radius: 10px; font-size: 16px; }
#touch .mid { position: absolute; right: calc(12px + var(--safe-r)); bottom: calc(150px + var(--safe-b)); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
#touch.lift-r ~ #hud #hud-br { right: 50%; transform: translateX(50%); }
#touch.lift-r ~ #hud .speedo { transform-origin: bottom center; }
#touch.lift-l ~ #hud #hud-bl { bottom: calc(150px + var(--safe-b)); }
#touch:not([hidden]) ~ #hud #hint { display: none; }

/* ================= 메뉴 ================= */
#menu { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; }
#menu.dim { background: rgba(6, 8, 11, 0.86); }
#menu.home { background: linear-gradient(0deg, rgba(5, 7, 10, 0.95) 0%, rgba(5, 7, 10, 0.4) 42%, rgba(5, 7, 10, 0) 62%), linear-gradient(90deg, rgba(5, 7, 10, 0.6), rgba(5, 7, 10, 0) 40%); }
#menu.side { background: linear-gradient(90deg, rgba(5, 7, 10, 0.94) 0%, rgba(5, 7, 10, 0.82) 46%, rgba(5, 7, 10, 0.05) 75%); }
.topbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l)); background: linear-gradient(180deg, rgba(4, 6, 9, 0.92), rgba(4, 6, 9, 0.6)); border-bottom: 1px solid var(--line-soft); }
.topbar .title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar .title b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 26px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 26px; letter-spacing: 0.5px; white-space: nowrap; }
.logo em { color: var(--accent); font-style: italic; }
.backbtn { width: 40px; height: 40px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.08); border: 0; cursor: pointer; font-size: 20px; clip-path: var(--slant); }
.backbtn:hover, .backbtn:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
.wallet { display: flex; align-items: center; gap: 8px; }
.pill-stat { display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 8px; background: rgba(255, 255, 255, 0.07); font-family: var(--display); font-weight: 800; font-size: 19px; font-style: italic; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill-stat .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-style: normal; font-weight: 800; }
.pill-stat .ic.rs { background: #2bb35a; color: #fff; }
.pill-stat .ic.gd { background: var(--gold); color: #3a2800; }
.pill-stat .ic.lv { background: var(--accent); color: var(--accent-ink); }
.pill-stat .fame { width: 60px; height: 5px; background: rgba(255, 255, 255, 0.15); position: relative; }
.pill-stat .fame i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.page { padding: 16px calc(18px + var(--safe-r)) calc(24px + var(--safe-b)) calc(18px + var(--safe-l)); display: flex; flex-direction: column; gap: 16px; animation: slide 0.25s ease-out; }
@keyframes slide { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.page.narrow { max-width: 640px; }
.page.half { max-width: 560px; }
.home-page { min-height: calc(100% - 62px); justify-content: flex-end; }
.hero-title { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(46px, 8vw, 88px); line-height: 0.85; margin: 0; letter-spacing: -1px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); }
.hero-title em { color: var(--accent); font-style: italic; }
.hero-sub { margin: 6px 0 0; color: #c7d0da; font-size: 14px; max-width: 46ch; line-height: 1.5; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; touch-action: pan-x pan-y; scrollbar-width: thin; }
.card { flex: 0 0 auto; width: 230px; scroll-snap-align: start; display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; cursor: pointer; background: var(--panel-2); position: relative; overflow: hidden; transition: transform 0.15s; }
.card:hover, .card:focus-visible { transform: translateY(-4px); outline: none; box-shadow: 0 0 0 2px var(--accent); }
.card .art { height: 118px; position: relative; background: linear-gradient(135deg, #16324a, #0b1119); }
.card .art canvas { width: 100%; height: 100%; display: block; }
.card .art .badge { position: absolute; left: 0; top: 10px; padding: 3px 12px 3px 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; font-style: italic; font-size: 14px; letter-spacing: 1px; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card .body b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 24px; line-height: 1; }
.card .body span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.card .prog { height: 4px; background: rgba(255, 255, 255, 0.1); margin-top: auto; }
.card .prog i { display: block; height: 100%; background: var(--accent); }
.card.primary { box-shadow: inset 0 -4px 0 var(--accent); }
.card.small { width: 150px; }
.card.small .art { height: 70px; }
h2.head { font-family: var(--display); font-style: italic; font-size: 34px; font-weight: 800; margin: 0; line-height: 1; }
h3 { font-family: var(--display); font-style: italic; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--muted); margin: 0; text-transform: uppercase; }
.sub { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
.panel { background: var(--panel-2); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel.accent { border-left: 4px solid var(--accent); }
.two-col { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.btn { padding: 12px 22px; border: 0; background: rgba(255, 255, 255, 0.1); cursor: pointer; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 20px; letter-spacing: 0.5px; clip-path: var(--slant); color: var(--text); }
.btn:hover, .btn:focus-visible { background: rgba(255, 255, 255, 0.2); outline: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); padding: 14px 34px; font-size: 24px; }
.btn.primary:hover, .btn.primary:focus-visible { background: #53c8ff; }
.btn.gold { background: var(--gold); color: #2b1d00; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 9px 16px; border: 0; background: rgba(255, 255, 255, 0.08); cursor: pointer; font-weight: 700; font-size: 14px; clip-path: var(--slant); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tsel { flex: 0 0 auto; width: 160px; display: flex; flex-direction: column; gap: 5px; padding: 8px; border: 0; background: var(--panel-2); cursor: pointer; text-align: left; scroll-snap-align: start; }
.tsel[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.tsel:focus-visible { outline: 2px solid var(--accent); }
.tsel canvas { width: 100%; height: 80px; display: block; }
.tsel b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 19px; line-height: 1; }
.tsel span { font-size: 11px; color: var(--muted); }
.tsel .meta { display: flex; justify-content: space-between; font-family: var(--display); font-size: 13px; color: var(--muted); font-style: italic; }
.teams { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; touch-action: pan-x pan-y; }
.team-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border: 0; background: var(--panel-2); cursor: pointer; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 16px; white-space: nowrap; }
.team-chip i { width: 10px; height: 26px; }
.team-chip[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.team-chip small { font-family: var(--display); color: var(--muted); font-size: 13px; }
.pr { display: flex; align-items: baseline; gap: 8px; }
.pr b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 54px; line-height: 0.9; color: var(--accent); }
.pr small { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 16px; letter-spacing: 2px; color: var(--muted); }
.upg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 12px; background: rgba(255, 255, 255, 0.05); }
